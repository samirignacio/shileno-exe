<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shileno.exe — Sobrevive el Día</title>
  <meta name="description" content="Juego de supervivencia e ironía urbana chilena. ¿Puedes sobrevivir un día completo con saldo en la Cuenta RUT?">
  <meta name="monetag" content="3a2ec02be261bd3b98d4ee025ede62c8">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── PANTALLA DE INICIO ── -->
  <div id="splash-screen">
    <div id="splash-content">

      <div id="splash-sprite-wrap">
        <img id="splash-sprite" src="assets/player-normal.png" alt="Shileno">
      </div>

      <div id="splash-title-wrap">
        <p id="splash-pre">▶ chilechallenge.online</p>
        <h1 id="splash-title" data-text="SHILENO.EXE">SHILENO.EXE</h1>
        <p id="splash-sub">Sobrevive un día más en Santiago</p>
      </div>

      <div id="mode-selector">
        <p id="mode-label">— ELIGE TU MODO —</p>

        <button class="mode-btn active-mode" data-mode="normal" onclick="selectMode(this)">
          <span class="mode-icon">🏙️</span>
          <span class="mode-info">
            <strong>SHILENO.EXE</strong>
            <small>Modo Normal — Un día cualquiera en Santiago</small>
          </span>
          <span class="mode-tag available">DISPONIBLE</span>
        </button>

        <button class="mode-btn" data-mode="ufo" onclick="selectMode(this)">
          <span class="mode-icon">🛸</span>
          <span class="mode-info">
            <strong>UFO-SHILENO.EXE</strong>
            <small>El Viaje Místico — El folclor te consume</small>
          </span>
          <span class="mode-tag available">DISPONIBLE</span>
        </button>

        <button class="mode-btn locked" disabled>
          <span class="mode-icon">🦆</span>
          <span class="mode-info">
            <strong>SHILENO-PATO.EXE</strong>
            <small>Austeridad extrema — Sin empleo, sin plata, sin alma</small>
          </span>
          <span class="mode-tag dlc">DLC PRÓXIMO</span>
        </button>

        <button class="mode-btn locked" disabled>
          <span class="mode-icon">🍻</span>
          <span class="mode-info">
            <strong>EDICIÓN 18</strong>
            <small>Fiestas Patrias — Fondas, terremotos y deudas</small>
          </span>
          <span class="mode-tag dlc">DLC PRÓXIMO</span>
        </button>

        <button class="mode-btn locked" disabled>
          <span class="mode-icon">🎒</span>
          <span class="mode-info">
            <strong>SHILENO-TURISTA.EXE</strong>
            <small>Mochilero — Recorre Chile con $0 en el bolsillo</small>
          </span>
          <span class="mode-tag dlc">DLC PRÓXIMO</span>
        </button>

        <button class="mode-btn locked" disabled>
          <span class="mode-icon">🌎</span>
          <span class="mode-info">
            <strong>NI-TAN-SHILENO.EXE</strong>
            <small>Choque Cultural — Chile desde afuera</small>
          </span>
          <span class="mode-tag dlc">DLC PRÓXIMO</span>
        </button>
      </div>

      <!-- Cafecito SOLO en splash -->
      <a class="btn-donacion" href="https://cafecito.app" target="_blank" rel="noopener">
        ☕ Invítale un Súper 8 al dev
      </a>

      <button id="btn-start" onclick="startGame()">▶ INICIAR DÍA</button>
      <p id="splash-version">v1.1 — chilechallenge.online</p>

    </div>
  </div>

  <!-- ── TRANSICIÓN ETAPA ── -->
  <div id="stage-transition">
    <div id="stage-icon" class="stage-icon">🌅</div>
    <h2 id="stage-title">MAÑANA COMPLETADA</h2>
    <p id="stage-subtitle">Aguantaste la mañana. Por ahora.</p>
  </div>

  <!-- ── JUEGO ── -->
  <div id="main-layout" style="display:none">

    <div class="left-col">
      <div id="stats-container">
        <div id="game-stage">🌅 MAÑANA (1/3)</div>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">💰 Cuenta RUT</span>
            <span class="stat-value" id="stat-plata">$15.000</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">🛡️ Vulnerable</span>
            <span class="stat-value" id="stat-vulnerable">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">🧠 Cordura</span>
            <span class="stat-value" id="stat-cordura">100</span>
            <div class="stat-bar-wrap">
              <div class="stat-bar cordura" id="bar-cordura" style="width:100%"></div>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-label">🌀 Delirio</span>
            <span class="stat-value" id="stat-delirio">0</span>
            <div class="stat-bar-wrap">
              <div class="stat-bar delirio" id="bar-delirio" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="character-container">
        <img id="player-sprite" src="assets/player-normal.png" alt="Shileno">
      </div>
    </div>

    <div id="game-container">
      <h3 id="event-title">⚡ CARGANDO...</h3>
      <p id="event-text" data-text=""></p>
      <p id="event-subtext"></p>
      <div id="options-container"></div>
    </div>

  </div>

  <!-- ── BANNER FIJO MONETAG (solo durante el juego) ── -->
  <div id="banner-ad" style="display:none">
    <div id="monetag-banner-wrap">
      <!-- Monetag Banner 320x50 -->
      <script async data-cfasync="false"
        src="//alwingulla.com/88/tag.min.js"
        data-zone="11044318"
        type="text/javascript"></script>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <!-- Monetag Popunder — se activa una sola vez al iniciar el juego -->
  <script>
    function firePopunder() {
      if (sessionStorage.getItem('popunder_fired')) return;
      sessionStorage.setItem('popunder_fired', '1');
      (function(d,z,s){
        s.src='https://'+d+'/400/'+z;
        try{(document.body||document.documentElement).appendChild(s)}catch(e){}
      })('gizokraijaw.net',11044318,document.createElement('script'));
    }
  </script>

  <!-- Monetag In-Page Push (Banner) zone 11054246 -->
  <script>
    (function(s){
      s.dataset.zone='11054246';
      s.src='https://nap5k.com/tag.min.js';
    })([document.documentElement, document.body]
      .filter(Boolean).pop()
      .appendChild(document.createElement('script')));
  </script>

</body>
</html>
