<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobrevive el Día - .EXE</title>
    <link rel="stylesheet" href="style.css?v=1.5">
</head>
<body>

    <div id="main-layout">
        
        <div id="stats-container">
            <h2>📊 ESTADO CIVIL</h2>
            <p>🌅 Etapa: <strong id="current-stage">MAÑANA</strong></p>
            <p>💰 Cuenta RUT: $<span id="stat-plata">15000</span></p>
            <p>🧠 Cordura: <span id="stat-cordura">100</span>/100</p>
            <p>🤪 Delirio: <span id="stat-delirio">0</span>/100</p>
            <p>🛡️ Vulnerable: <span id="stat-vulnerable">0</span></p>
            
            <div id="character-container">
                <img id="player-sprite" src="assets/player-normal.png" alt="Mono">
            </div>
        </div>

        <div id="game-container">
            <h3 id="event-title">Cargando aviso...</h3>
            <p id="event-text"></p>
            <p id="event-subtext"></p>

            <div id="options-container"></div>
        </div>

    </div>

    <div id="game-over-container" style="display: none;">
        <h1 id="game-over-title">FIN DEL JUEGO</h1>
        <p id="game-over-text"></p>
        <button onclick="location.reload()">REINTENTAR DÍA</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=1.8"></script>
</body>
</html>
