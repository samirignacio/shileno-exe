<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="monetag" content="9d9d4a022fef0ce04a488ecd556b15ef"> 

    <title>Shileno.exe</title>
    <link rel="stylesheet" href="style.css?v=1.6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main id="main-layout">
        
        <section class="game-sidebar">
            <div class="stats-panel">
                <div class="stat-box">💸 Plata: <span id="stat-plata">$0</span></div>
                <div class="stat-box">🧠 Cordura: <span id="stat-cordura">100</span></div>
                <div class="stat-box">🌀 Delirio: <span id="stat-delirio">0</span></div>
                <div class="stat-box">🛡️ Vulnerable: <span id="stat-vulnerable">0</span></div>
            </div>
            
            <div class="avatar-container">
                <img id="player-sprite" src="player-normal.png" alt="Estado del Personaje">
            </div>
        </section>

        <section class="game-content">
            <div class="card-container">
                <div class="card-header">
                    <span id="game-stage">🌅 MAÑANA</span>
                </div>
                <div class="card-body">
                    <p id="event-text">Cargando la paranoia del día...</p>
                    <p id="event-subtext" class="letra-chica"></p>
                </div>
            </div>

            <div id="options-container" class="options-list">
                </div>
        </section>

    </main>

    <footer id="monetization-footer">
        <div class="ads-clean-banner">
            <p class="ad-placeholder">📺 Espacio publicitario limpio (CPM Pasivo)</p>
        </div>
        <div class="donation-button-container">
            <a href="https://chilechallenge.online" target="_blank" class="cafecito-btn">
                ☕ ¿Sobreviviste al día? Invítale un Súper 8 al dev
            </a>
        </div>
    </footer>

    <script src="script.js?v=2.2"></script>
</body>
</html>
